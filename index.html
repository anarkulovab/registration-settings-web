<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <header>
        <img src="assets/header.jpg">
    </header>
    <main>
        <div class="container">
            <h1>Регистрация</h1>
            <form action="index2.html">
                <div class="row g-3 mb-5">
                    <div class="col-md-4">
                        <label class="form-label" for="username">Имя</label>
                        <input class="form-control" id="username" type="text" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="surname">Фамилия</label>
                        <input class="form-control" id="surname" type="text" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="birth_date">Дата рождения</label>
                        <input class="form-control" id="birth_date" type="date" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="email">Почта</label>
                        <input class="form-control" id="email" type="email" placeholder="test@mail.ru" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="phone">Номер телефона</label>
                        <input class="form-control" id="phone" type="text" placeholder="+7(999)9999999" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="password">Пароль</label>
                        <input class="form-control" id="password" type="password" />
                    </div>
                </div>

                <div class="row g-3 mb-5">
                    <div class="col-md-8">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="agreement" />
                            <label class="form-check-label" for="agreement">Подписаться на рассылки</label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" type="submit" id="login">Войти</button>
                    </div>
                </div>
            </form>
        </div>
    </main>
    <footer>
    </footer>
</body>
</html>
