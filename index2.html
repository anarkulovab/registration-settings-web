<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container mt-5">
        <div class="row g-3 mb-5">
            <div class="col-md-6 mb-5">
                <h5>Рассылки</h5>
                <p>Подпишись, чтобы всегда узнавать о наших акциях первым</p>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="sms" checked>
                    <label class="form-check-label" for="sms">SMS</label>
                </div>

                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="email">
                    <label class="form-check-label" for="email">E-mail</label>
                </div>

                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="push">
                    <label class="form-check-label" for="згыр">Push уведомления</label>
                </div>
            </div>

            <div class="col-md-6 mb-5">
                <h5>Категории</h5>
                <p>Можно менять 1 раз в месяц</p>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="tech" disabled>
                    <label class="form-check-label" for="tech">Техника</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="home_stuff" disabled>
                    <label class="form-check-label" for="home_stuff">Товары для дома</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="clothes" checked>
                    <label class="form-check-label" for="clothes">Одежда</label>
                </div>
            </div>

            <div class="col-md-6 mb-5">
                <h5>Адрес доставки</h5>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="addres" id="addres1">
                    <label class="form-check-label" for="addres1">г. Москва, Большой Афанасьевский переулок д4 к5
                        кв6</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="addres" id="addres2" checked>
                    <label class="form-check-label" for="addres2">г. Москва, ул. Вострухина д6 к4 кв4</label>
                </div>
            </div>

            <div class="col-md-6 mb-5">
                <select class="form-select">
                    <option value="1">
                        <h1>Красный</h1>
                    </option>
                    <option value="2">Зелёный</option>
                    <option value="3">Синий</option>
                </select>
            </div>
        </div>
    </div>
    <button class="btn btn-primary ms-5" type="button">Сохранить</button>

</body>

</html>
